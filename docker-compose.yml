services:
  telegram-channels-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: darkshrine/telegram-channels-bot:latest
    container_name: telegram-channels-bot
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3030}
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      - ./generated:/app/generated
